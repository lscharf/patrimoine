name: Image Docker

# Publie l'image sur le registre de conteneurs GitHub (GHCR).
#
# Aucun jeton personnel n'est nécessaire : le `GITHUB_TOKEN` fourni
# automatiquement au workflow suffit, à condition de lui accorder la
# permission `packages: write` ci-dessous.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Une seule construction à la fois par référence : un push qui en suit un
# autre annule le précédent au lieu de publier deux images concurrentes.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authentification auprès de GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcul des étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Première construction : chargée localement, pas publiée. Rien ne part
      # sur le registre avant que les deux vérifications ci-dessous passent.
      - name: Construction
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: patrimoine:verification
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Le paquet est public : une image qui embarquerait la base ou le
      # fichier d'environnement exposerait les positions financières à tout
      # le monde. `.dockerignore` couvre déjà le cas ; ce garde-fou existe
      # pour qu'une régression future échoue ici plutôt qu'en silence.
      - name: Aucune donnée personnelle embarquée
        run: |
          docker run --rm --entrypoint /bin/sh patrimoine:verification -c '
            fail=0
            if [ -n "$(ls -A /app/data 2>/dev/null)" ]; then
              echo "ÉCHEC : /app/data n'\''est pas vide"; ls -la /app/data; fail=1
            fi
            for f in /app/.env /app/scripts/import-portefeuille.ts; do
              if [ -e "$f" ]; then echo "ÉCHEC : $f est présent dans l'\''image"; fail=1; fi
            done
            if find /app \( -name "*.db" -o -name "*.db-wal" -o -name "*.db-shm" \) -print | grep -q .; then
              echo "ÉCHEC : une base SQLite est embarquée"
              find /app \( -name "*.db" -o -name "*.db-wal" -o -name "*.db-shm" \) -print
              fail=1
            fi
            [ "$fail" -eq 0 ] && echo "✓ image saine"
            exit $fail
          '

      # Démarrage réel du conteneur. C'est la seule façon de prouver que le
      # binaire natif de better-sqlite3 se charge et que les migrations
      # s'appliquent — deux choses invérifiables sans Docker en local.
      - name: Démarrage à blanc
        run: |
          set -eux
          docker run -d --name smoke -p 3000:3000 \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            -e BETTER_AUTH_URL="http://localhost:3000" \
            -e AUTH_ALLOWED_EMAILS="ci@example.invalid" \
            patrimoine:verification

          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 2
          done

          echo "--- santé ---"
          curl -sf http://localhost:3000/api/health

          echo "--- la page de connexion répond ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/connexion)" = "200"

          echo "--- une page protégée redirige ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "307"

          echo "--- les migrations ont créé la base ---"
          docker exec smoke /bin/sh -c 'test -f /app/data/portfolio.db'

          echo "--- journaux ---"
          docker logs smoke
          docker rm -f smoke

      # Reconstruction entièrement servie par le cache : quelques secondes.
      - name: Publication sur GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

      - name: Récapitulatif
        run: |
          {
            echo "### Image publiée"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
